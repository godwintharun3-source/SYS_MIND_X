[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "system-mind-backend"
version = "1.0.0"
description = "SYSTEM MIND X - Universal AI Computer-Operation and Governance Platform (Control Plane & Twin)"
readme = "src/README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "SYSTEM MIND X Core Architecture Team", email = "architecture@systemmind.local" }
]
keywords = [
    "operating-system",
    "ai-agent",
    "governance",
    "temporal-twin",
    "safety-critical",
    "audit-ledger",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Operating System",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==4.1.0",
]
lint = [
    "black==24.3.0",
    "flake8==7.0.0",
]
types = [
    "mypy==1.9.0",
]

[project.scripts]
system-mind = "system_mind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "unit: Fast, deterministic unit tests with mocks",
    "integration: Cross-module pipeline tests",
    "e2e: End-to-end full system and operator journey tests",
    "contract: Invariant, schema, and API wire contract tests",
    "safety_critical: Charter invariant tests (SC-01 through SC-08)",
]


[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | \.venv
  | build
  | dist
  | apps
  | crates
  | target
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501"]
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "apps",
    "crates",
    "target",
]


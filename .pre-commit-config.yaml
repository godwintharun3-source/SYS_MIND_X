# SYSTEM MIND X — Pre-Commit Hook Configuration
# Enforces formatting, linting, monorepo boundaries, and safety invariants before commit.

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]

  - repo: local
    hooks:
      - id: py-compile-check
        name: Python Syntax Compilation Check
        entry: python3 -m py_compile
        language: system
        types: [python]

      - id: verify-monorepo-boundaries
        name: Monorepo Zone & Boundary Verification
        entry: python3 -m pytest tests/test_monorepo_boundaries.py
        language: system
        pass_filenames: false

      - id: verify-schemas-parity
        name: Shared Schemas & Cross-Language Parity Check
        entry: python3 tools/generate_types.py --check
        language: system
        pass_filenames: false

      - id: check-no-ambient-shell
        name: Safety Invariant SC-01 (Zero Ambient Shell)
        entry: 'python3 tools/lint.py --ast-safety'
        language: system
        pass_filenames: false
